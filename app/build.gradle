plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wanyuea.neuqclassroom'
    compileSdk 34

    defaultConfig {
        applicationId "com.wanyuea.neuqclassroom"
        minSdk 26
        targetSdk 34
        versionCode 125
        versionName "1.4.1"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("NCQ_KEYSTORE") ?: "neuq.jks")
            storePassword System.getenv("NCQ_STORE_PASS") ?: "neuq2026"
            keyAlias System.getenv("NCQ_KEY_ALIAS") ?: "neuq"
            keyPassword System.getenv("NCQ_KEY_PASS") ?: "neuq2026"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

/*
 * 单测依赖。
 *
 * 只有测试期用到，不进 APK —— 「不依赖任何第三方库」的发布包体积不变。
 * org.json 必须显式引 Maven 的实现：单元测试跑在 JVM 上，android.jar 里的
 * org.json 只是桩，不引它会在调用 JSONObject 时抛 "Method ... not mocked"。
 */
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

// 不依赖任何第三方库，构建更快、体积更小

/*
 * 发版前自动校验日期逻辑（tools/check-dates.js）。
 *
 * 起因：v3.8.3 课表页「今天」高亮整列偏一天（周五被标成周四），
 * 根因是星期换算漏了 +1。这类错误肉眼很难发现，所以做成构建时的硬门槛：
 * 只要 tools/check-dates.js 断言失败，assembleRelease 直接中断。
 *
 * 找不到 node 时只警告不阻断 —— 不因为环境缺 node 就让整个构建挂掉。
 */
tasks.configureEach { t ->
    if (t.name == "preReleaseBuild") {
        // 排课单测也当硬门槛：这一层真出过错（v1.1.1 跨周调休丢课），
        // 断言失败就不该出包。临时跳过用 NCQ_SKIP_TESTS=1。
        if (System.getenv("NCQ_SKIP_TESTS") == null) {
            t.dependsOn("testDebugUnitTest")
        }
        t.doFirst {
            def script = rootProject.file("tools/check-dates.js")
            if (!script.exists()) {
                logger.warn("[check-dates] 跳过：找不到 " + script)
                return
            }
            def nodeBin = System.getenv("NCQ_NODE") ?: "node"
            try {
                def out = new ByteArrayOutputStream()
                def result = exec {
                    commandLine nodeBin, script.absolutePath
                    standardOutput = out
                    errorOutput = out
                    ignoreExitValue = true
                }
                if (result.exitValue != 0) {
                    throw new GradleException(
                        "[check-dates] 日期逻辑校验未通过，已阻止出包：\n" + out.toString("UTF-8"))
                }
                logger.lifecycle("[check-dates] 日期逻辑校验通过")
            } catch (IOException e) {
                logger.warn("[check-dates] 跳过：未找到 node（可用 NCQ_NODE 指定路径）")
            }
        }
    }
}
